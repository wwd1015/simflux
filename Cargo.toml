[package]
name = "simflux"
version = "0.3.0"
edition = "2021"

[lib]
name = "simflux"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.11"
nalgebra = "0.33"
statrs = "0.17"
thiserror = "2.0"

arrow = "54.0"
parquet = "54.0"

[dependencies.pyo3-polars]
version = "0.20"
features = ["lazy"]

[dev-dependencies]
tempfile = "3"