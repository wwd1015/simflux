[package]
name = "simflux"
version = "0.3.0"
edition = "2021"

[lib]
name = "simflux"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: build a single forward-compatible wheel for CPython 3.12+ so wheel
# builds don't break when a runner ships a Python newer than pyo3's max (the CI
# --find-interpreter previously picked up 3.14, which pyo3 0.23 rejects).
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
numpy = "0.23"
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.11"
nalgebra = "0.33"
statrs = "0.17"
thiserror = "2.0"

arrow = "54.0"
parquet = "54.0"

[dev-dependencies]
tempfile = "3"