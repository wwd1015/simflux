name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust lint
      run: |
        cargo fmt --all -- --check
        cargo clippy -- -D warnings

    - name: Python lint
      run: |
        pip install black ruff mypy
        black --check python/
        ruff check python/
        mypy python/ --ignore-missing-imports

  test:
    name: Test – ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install deps & build
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest pytest-benchmark
        # `maturin develop` needs an active virtualenv (absent on CI runners);
        # build a release wheel and install it instead. abi3 makes the cp312
        # wheel install on 3.12 and 3.13 alike.
        maturin build --release --out dist
        pip install --find-links dist simflux

    - name: Run tests
      run: pytest tests/ -v --benchmark-skip

    - name: Run benchmarks (Ubuntu 3.12 only)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      # Informational only — a benchmark hiccup must not gate the test job.
      continue-on-error: true
      run: |
        pip install psutil
        python benchmarks/performance_comparison.py > benchmark_results.txt
        cat benchmark_results.txt
