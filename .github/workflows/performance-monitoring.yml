name: Performance Monitoring

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest pytest-benchmark pandas matplotlib seaborn

    - name: Build extension
      run: maturin develop --release

    - name: Run performance benchmarks
      run: |
        python benchmarks/performance_comparison.py

    - name: Generate performance report
      run: |
        python -c "
        import pandas as pd
        import matplotlib.pyplot as plt
        import numpy as np
        from pathlib import Path

        # Create a simple performance tracking report
        results = {
            'timestamp': pd.Timestamp.now(),
            'commit': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}'
        }

        # Save to performance history
        pd.DataFrame([results]).to_csv('performance_history.csv', mode='a', header=not Path('performance_history.csv').exists(), index=False)
        print('Performance tracking completed')
        "

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          simflux_benchmark_*.csv
          simflux_benchmark_report_*.txt
          performance_history.csv