[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "simflux"
version = "0.1.0"
description = "High-performance financial simulation library with Rust backend"
authors = [{name = "SimFlux Contributors"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "polars>=0.20.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
full = [
    "scipy>=1.7.0",  # For portfolio fallback
]
dev = [
    "pytest>=6.0",
    "pytest-benchmark",
    "black",
    "ruff",
    "mypy",
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.maturin]
python-source = "python"
module-name = "simflux._rust"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true