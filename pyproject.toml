[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "simflux"
version = "0.2.0"
description = "High-performance financial simulation library with Rust backend"
authors = [{name = "SimFlux Contributors"}]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.2.0",
    "pandas>=3.0.0",
    "polars>=1.38.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
full = [
    "scipy>=1.14.0",  # For portfolio fallback
]
dev = [
    "pytest>=8.3.0",
    "pytest-benchmark>=5.1.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "psutil>=6.0.0",
    "pre-commit>=4.0.1",
]

[tool.maturin]
python-source = "python"
module-name = "simflux._rust"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true